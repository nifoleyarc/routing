name: build geo files

on:
  schedule:
    # Раз в неделю: за месяц наши категории в geosite меняются на +52/-2
    # домена, а Happ всё равно не забирает geo-файлы чаще раза в неделю.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.sh
      - trim.py
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-geo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh падает, если хоть одна категория не найдена в апстриме.
      # Это намеренно: .dat без категории, на которую ссылается конфиг,
      # заставит ядро отказаться стартовать у каждого клиента.
      - name: Собрать
        run: ./build.sh

      - name: Проверить ядром
        run: |
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          XRAY_LOCATION_ASSET="$PWD/dist" ./xray run -test -c dist/smoke.json

      - name: Ветка release
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin release --depth 1 || true
          if git show-ref -q refs/remotes/origin/release; then
            git checkout -B release origin/release
          else
            git checkout --orphan release
            git rm -rq --cached . || true
          fi

          cp dist/geosite.dat dist/geoip.dat dist/sha256sum.txt .
          git add -f geosite.dat geoip.dat sha256sum.txt

          if git diff --cached --quiet; then
            echo "апстримы не изменились, публиковать нечего"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "geo: $(date -u +%Y-%m-%d)"
            git push origin release
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Тег фиксированный: ссылка .../releases/latest/download/ не меняется,
      # кеша у Releases нет, лимита на размер файла тоже.
      # Имя тега обязано отличаться от имени ветки: одноимённые ref
      # неоднозначны, и ссылка jsDelivr @release может уехать в тег.
      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          # Наличие релиза проверяется отдельно от изменений в ветке:
          # иначе удалённый вручную релиз никогда не восстановится,
          # потому что ветка при неизменных апстримах остаётся прежней.
          if [ "$CHANGED" != "true" ] && gh release view latest >/dev/null 2>&1; then
            echo "релиз на месте, апстримы не менялись"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --title "geo $(date -u +%Y-%m-%d)" --notes \
            "Собрано из Loyalsoldier + roscomvpn. Состав категорий — build.sh." \
            dist/geosite.dat dist/geoip.dat dist/sha256sum.txt
