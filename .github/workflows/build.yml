name: build geo files

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_routing:
        description: "Обновить routing-профиль, даже если geo-файлы не менялись"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - build.sh
      - trim.py
      - make-deeplink.py
      - push-routing.py
      - check-config.py
      - canonical.py
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-geo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh падает, если хоть одна категория не найдена в апстриме.
      # Это намеренно: .dat без категории, на которую ссылается конфиг,
      # заставит ядро отказаться стартовать у каждого клиента.
      - name: Собрать
        run: ./build.sh

      - name: Проверить ядром
        run: |
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          XRAY_LOCATION_ASSET="$PWD/dist" ./xray run -test -c dist/smoke.json

      # Конфиг живёт в подписке, geo-файлы здесь — разойтись они могут
      # молча, и тогда ядро у клиента не стартует. Проверка стоит ДО
      # публикации: при расхождении на клиентах остаются прежние рабочие
      # файлы, а не новые ломающие.
      - name: Сверить с конфигом из подписки
        env:
          SUB_URL: ${{ secrets.REMNAWAVE_SUB_URL }}
        run: |
          if [ -z "$SUB_URL" ]; then
            echo "::warning::секрет REMNAWAVE_SUB_URL не задан, конфиг из подписки не проверен"
            exit 0
          fi
          python3 check-config.py dist "$SUB_URL"

      - name: Ветка release
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Признак изменения — canonical.txt, а не хеш файла: апстрим
          # переставляет записи внутри категорий при каждой пересборке,
          # и .dat меняет хеш при нулевом изменении содержимого.
          git fetch origin release --depth 1 || true
          if git show-ref -q refs/remotes/origin/release &&
             git show origin/release:canonical.txt 2>/dev/null |
               diff -q - dist/canonical.txt >/dev/null 2>&1; then
            echo "апстримы не изменились, публиковать нечего"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ветка одно-коммитная и переписывается force-push: она нужна
          # только как зеркало для jsDelivr. Хранить историю .dat незачем,
          # иначе репозиторий копит сотни мегабайт бинарников в год.
          git checkout --orphan _rel
          git rm -rq --cached . || true
          cp dist/geosite.dat dist/geoip.dat dist/sha256sum.txt dist/canonical.txt .
          git add -f geosite.dat geoip.dat sha256sum.txt canonical.txt
          git commit -qm "geo: $(date -u +%Y-%m-%d)"
          git push -f origin _rel:release
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Тег фиксированный: ссылка .../releases/latest/download/ не меняется,
      # кеша у Releases нет, лимита на размер файла тоже.
      # Имя тега обязано отличаться от имени ветки: одноимённые ref
      # неоднозначны, и ссылка jsDelivr @release может уехать в тег.
      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          # Наличие релиза проверяется отдельно от изменений в ветке:
          # иначе удалённый вручную релиз никогда не восстановится,
          # потому что ветка при неизменных апстримах остаётся прежней.
          if [ "$CHANGED" != "true" ] && gh release view latest >/dev/null 2>&1; then
            echo "релиз на месте, апстримы не менялись"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --title "geo $(date -u +%Y-%m-%d)" --notes \
            "Собрано из Loyalsoldier + roscomvpn. Состав категорий — build.sh." \
            dist/geosite.dat dist/geoip.dat dist/sha256sum.txt dist/canonical.txt

      # Happ читает routing-профиль из заголовка `routing` на ответе
      # подписки. Профиль пересобирается со свежим LastUpdated только когда
      # geo-файлы реально изменились: клиент перекачивает их, лишь если
      # метка выросла, а чаще раза в неделю он этого всё равно не делает.
      - name: Routing-профиль в Remnawave
        if: >-
          steps.publish.outputs.changed == 'true' ||
          inputs.force_routing
        env:
          REMNAWAVE_URL: ${{ secrets.REMNAWAVE_URL }}
          REMNAWAVE_TOKEN: ${{ secrets.REMNAWAVE_TOKEN }}
        run: |
          if [ -z "$REMNAWAVE_URL" ] || [ -z "$REMNAWAVE_TOKEN" ]; then
            echo "секреты REMNAWAVE_URL / REMNAWAVE_TOKEN не заданы, шаг пропущен"
            exit 0
          fi
          python3 make-deeplink.py --repo "$GITHUB_REPOSITORY"
          python3 push-routing.py HAPP.DEEPLINK
